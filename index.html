<!DOCTYPE html>
<html>
<head>
    <title>Aladdin Ali</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px 50px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.10);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #1a1a2e;
            font-size: 28px;
            margin-bottom: 6px;
        }
        .subtitle {
            color: #4a4a6a;
            font-size: 18px;
            font-weight: 500;
            margin: 0 0 8px 0;
        }
        .tagline {
            color: #6b6b8a;
            font-size: 15px;
            margin-top: 4px;
        }
        hr {
            border: none;
            border-top: 2px solid #e0e0e0;
            margin: 24px 0 20px;
        }
        .visitor {
            font-size: 18px;
            color: #1a1a2e;
        }
        .visitor span {
            font-weight: 700;
            color: #2a6fdb;
            font-size: 22px;
        }
        .footer-note {
            margin-top: 30px;
            font-size: 13px;
            color: #9a9aae;
        }
    </style
</head>

<body>
    <div class="card">
        <h1>Aladdin Ali</h1>
        <p class="subtitle">☁️ Serverless · AWS · Cloud Infrastructure</p>
        <p class="tagline">Building things that work.</p>
        <hr>
        <p class="visitor">👤 Visitor Count: <span id="visitor-count">Loading...</span></p>
        <p class="footer-note">🌍 Global · Secure · Always On </p>
    </div>
    
    
    <script>
      async function getVisitorCount() {
        try {
            const response = await fetch('https://6axn3bk1id.execute-api.us-east-1.amazonaws.com/dev/visitor-count');
            const data = await response.json();
            document.getElementById('visitor-count').textContent = data.count;
        } catch (error) {
            document.getElementById('visitor-count').textContent = 'Error loading count';
        }
    }
    getVisitorCount();
    </script>
</body>
</html>
